name: GitHub release

on:
  push:
    tags:
      - suprnova-v*

permissions:
  contents: read

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    name: Package (${{ matrix.vscode_target }})
    runs-on: ${{ fromJSON(github.repository == 'eas4ai/suprnova-lsp' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && matrix.local_runner || toJSON(matrix.runner)) }}
    container:
      image: ${{ matrix.container }}
      # The named bind volume is configured from the Linux service's Cargo home.
      # Match its owner so container downloads never leave root-owned cache files.
      options: ${{ github.repository == 'eas4ai/suprnova-lsp' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && matrix.vscode_target == 'linux-x64' && format('--user {0}', vars.SUPRNOVA_LSP_LINUX_CONTAINER_USER) || '' }}
      volumes:
        - ${{ github.repository == 'eas4ai/suprnova-lsp' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && matrix.vscode_target == 'linux-x64' && 'suprnova-lsp-cargo:/github/service-cargo' || '/github/home/.cargo' }}
      env:
        CARGO_HOME: ${{ github.repository == 'eas4ai/suprnova-lsp' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && matrix.vscode_target == 'linux-x64' && '/github/service-cargo' || '/github/home/.cargo' }}
        RUSTUP_HOME: /github/home/.rustup
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            local_runner: '["self-hosted","Linux","X64","rust-ci"]'
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:4dc41da7df20400310c80d162a2fe2d2c2f3d9734d8dec20f6b9843711618deb
            rust_target: x86_64-unknown-linux-gnu
            vscode_target: linux-x64
            python: python3
          - runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64@sha256:29a6ceb78de5b00494e6e7456a72782a4cb54238de102e7491d15fe47789b4d1
            rust_target: aarch64-unknown-linux-gnu
            vscode_target: linux-arm64
            python: python3
          - runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            vscode_target: darwin-x64
            python: python3
          - runner: macos-15
            local_runner: '["self-hosted","macOS","ARM64","rust-ci"]'
            rust_target: aarch64-apple-darwin
            vscode_target: darwin-arm64
            python: python3
          - runner: windows-latest
            local_runner: '["self-hosted","Windows","X64","rust-ci"]'
            rust_target: x86_64-pc-windows-msvc
            vscode_target: win32-x64
            python: python
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Install Rust in Linux compatibility container
        if: matrix.container
        run: |
          # Keep installer binaries separate from the shared Cargo cache.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | CARGO_HOME="$HOME/.container-cargo-tools" sh -s -- -y --profile minimal --default-toolchain "$RUSTUP_TOOLCHAIN"
          echo "$HOME/.container-cargo-tools/bin" >> "$GITHUB_PATH"
      - name: Install native Rust toolchain
        if: ${{ !matrix.container }}
        uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-python
        if: ${{ !matrix.container }}
        with:
          python-version: '3.13'
      - uses: ./.github/actions/cargo-cache
        with:
          scope: github-release-${{ matrix.vscode_target }}
          target-dir: target
          dependency-key: ${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'rust-toolchain.toml') }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: editors/code/package-lock.json
      - name: Check release version and tag
        id: version
        run: |
          ${{ matrix.python }} .github/scripts/check_release_versions.py
          ${{ matrix.python }} - <<'PY'
          import os
          from pathlib import Path
          version = Path('.github/release-please/version.txt').read_text().strip()
          assert os.environ['GITHUB_REF_NAME'] == f'suprnova-v{version}', 'Tag and package versions disagree'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Install client dependencies
        run: npm ci
        working-directory: editors/code
      - name: Build and smoke-test distribution server
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: cargo run --profile dist --locked -p suprnova-lsp --target "$RUST_TARGET" -- --help
      - name: Package server archive
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ${{ matrix.python }} .github/scripts/package_server_archive.py --target "$RUST_TARGET" --profile dist --version "$RELEASE_VERSION"
      - name: Package VSIX
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          VSCODE_TARGET: ${{ matrix.vscode_target }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm run package:vsix -- --skip-build --profile dist --target "$RUST_TARGET" --vscode-target "$VSCODE_TARGET" --out "../../dist/suprnova-lsp-${RELEASE_VERSION}-${VSCODE_TARGET}.vsix"
        working-directory: editors/code
      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: github-release-${{ matrix.vscode_target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: github-release-*
          path: dist
          merge-multiple: true
      - name: Publish verified platform assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat .github/release-please/version.txt)
          test "$(find dist -name '*.vsix' | wc -l)" -eq 5
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq 5
          (cd dist && sha256sum *.vsix *.tar.gz > SHA256SUMS)
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Suprnova LSP imports generated model APIs from rustdoc JSON without running rust-analyzer.

          This preview includes distribution builds for Linux x64/ARM64, macOS Intel/Apple Silicon, and Windows x64. Each VSIX bundles its matching server. Linux packages use the glibc 2.28 compatibility build environment.

          Download the VSIX for your platform and use VS Code's **Install from VSIX** command. Reload VS Code after installation. The extension ID is `eas4ai.suprnova-lsp`; settings use `suprnova-lsp.*`. Copy desired Rust Glancer settings to the new prefix manually.

          Automatic exports use a two-second debounce and require the configured nightly Rust toolchain. Platform builds and server CLI smoke checks ran in CI. Full generated-model/editor acceptance was verified on Linux; other-platform editor behavior remains unverified.
          EOF
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease --title "Suprnova LSP $version" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.vsix dist/*.tar.gz dist/SHA256SUMS --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --notes-file "$RUNNER_TEMP/release-notes.md"

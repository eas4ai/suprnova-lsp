name: Local runner smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Runner smoke (${{ matrix.role }})
    if: github.repository == 'eas4ai/suprnova-lsp' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      SMOKE_ROLE: ${{ matrix.role }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: linux
            labels: [self-hosted, Linux, X64, rust-ci]
          - role: macos
            labels: [self-hosted, macOS, ARM64, rust-ci]
          - role: windows
            labels: [self-hosted, Windows, X64, rust-ci]
    defaults:
      run:
        shell: ${{ matrix.role == 'windows' && 'powershell' || 'bash' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-python
        with:
          python-version: '3.13'
      - name: Install native test tools
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: cargo-nextest@0.9.132
      - name: Check required native tools
        run: |
          rustfmt --version
          cargo nextest --version
      - name: Check Windows PowerShell
        if: matrix.role == 'windows'
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'PowerShell 7 is required' }
      - name: Check release shell
        shell: bash
        run: |
          set -euo pipefail
          rustc -vV
          if [ "$RUNNER_OS" = Linux ]; then
            docker info --format '{{.ServerVersion}}'
          fi
      - name: Check Linux release Cargo mount
        if: matrix.role == 'linux'
        shell: bash
        env:
          SERVICE_USER: ${{ vars.SUPRNOVA_LSP_LINUX_CONTAINER_USER }}
          RELEASE_IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:4dc41da7df20400310c80d162a2fe2d2c2f3d9734d8dec20f6b9843711618deb
        run: |
          set -euo pipefail
          test "$SERVICE_USER" = "$(id -u):$(id -g)"
          docker run --rm --user "$SERVICE_USER" \
            --mount type=volume,source=suprnova-lsp-cargo,target=/github/service-cargo \
            --env CARGO_HOME=/github/service-cargo \
            --env EXPECTED_INODE="$(stat -c '%i' "$CARGO_HOME")" \
            --env EXPECTED_USER="$SERVICE_USER" \
            "$RELEASE_IMAGE" bash -c '
              set -euo pipefail
              test "$CARGO_HOME" = /github/service-cargo
              test "$(stat -c "%i" "$CARGO_HOME")" = "$EXPECTED_INODE"
              test "$(id -u):$(id -g)" = "$EXPECTED_USER"
              probe=$(mktemp "$CARGO_HOME/.suprnova-lsp-container-probe.XXXXXX")
              trap '\''rm -f "$probe"'\'' EXIT
              test "$(stat -c "%u:%g" "$probe")" = "$EXPECTED_USER"
            '
      - name: Compile and test Rust probe
        run: python .github/scripts/runner_smoke.py
      - name: Upload runner observation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runner-smoke-${{ matrix.role }}
          path: .ci/runner-smoke/${{ matrix.role }}.json
          if-no-files-found: error
          retention-days: 7

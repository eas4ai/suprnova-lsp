name: Set up explicit Rust toolchain
description: Install the job's Rust version without changing the runner owner's default.

inputs:
  components:
    description: Optional comma-separated Rust components.
    required: false
    default: rustfmt

runs:
  using: composite
  steps:
    - name: Install Rust toolchain on Unix
      if: runner.os != 'Windows'
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
      run: |
        set -euo pipefail
        args=(toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update)
        if [ -n "$COMPONENTS" ]; then
          args+=(--component "$COMPONENTS")
        fi
        rustup "${args[@]}"
    - name: Install Rust toolchain on Windows
      if: runner.os == 'Windows'
      shell: powershell
      env:
        COMPONENTS: ${{ inputs.components }}
        LOCAL_RUNNER: ${{ runner.environment }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:LOCAL_RUNNER -eq 'self-hosted') {
          # Bash writes installer markers under HOME; Windows checks USERPROFILE.
          # Use the same writable directory for both within this job.
          # Cargo and Rustup retain their explicitly configured service homes.
          $jobHome = Join-Path $env:RUNNER_TEMP 'home'
          New-Item -ItemType Directory -Force $jobHome | Out-Null
          [IO.File]::AppendAllText($env:GITHUB_ENV, 'HOME=' + $jobHome.Replace('\', '/') + [Environment]::NewLine, (New-Object Text.UTF8Encoding($false)))
          [IO.File]::AppendAllText($env:GITHUB_ENV, 'USERPROFILE=' + $jobHome + [Environment]::NewLine, (New-Object Text.UTF8Encoding($false)))
        }
        # Git for Windows installs Bash outside the machine's Git command PATH.
        # Add it to this job only; the service and owner PATH stay unchanged.
        if (-not (Get-Command bash -ErrorAction SilentlyContinue)) {
          $gitRoot = Split-Path (Split-Path (Get-Command git -ErrorAction Stop).Source -Parent) -Parent
          $bashDirectory = Join-Path $gitRoot 'bin'
          if (-not (Test-Path (Join-Path $bashDirectory 'bash.exe'))) { throw 'Git Bash is required by native build steps' }
          $encoding = New-Object Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_PATH, $bashDirectory + [Environment]::NewLine, $encoding)
          [IO.File]::AppendAllText($env:GITHUB_PATH, (Join-Path $gitRoot 'usr\bin') + [Environment]::NewLine, $encoding)
        }
        if ($env:LOCAL_RUNNER -eq 'self-hosted' -and -not (Get-Command pwsh -ErrorAction SilentlyContinue)) {
          $pwsh = $env:SUPRNOVA_LSP_CI_PWSH
          if (-not $pwsh -or -not (Test-Path -LiteralPath $pwsh -PathType Leaf)) { throw 'Configure a runner-owned PowerShell 7 executable through SUPRNOVA_LSP_CI_PWSH' }
          [IO.File]::AppendAllText($env:GITHUB_PATH, (Split-Path $pwsh -Parent) + [Environment]::NewLine, (New-Object Text.UTF8Encoding($false)))
        }
        $arguments = @('toolchain', 'install', $env:RUSTUP_TOOLCHAIN, '--profile', 'minimal', '--no-self-update')
        if ($env:COMPONENTS) { $arguments += @('--component', $env:COMPONENTS) }
        & rustup @arguments
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
